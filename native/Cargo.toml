[workspace]
resolver = "2"
members = ["swbd-ink"]

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

# Fastest code, one LTO unit, no unwinding tables. No target-cpu: it must run on any x86-64 PC.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
