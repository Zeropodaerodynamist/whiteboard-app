<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="-apple-system, 'Segoe UI', system-ui, 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">How Whiteboard is built</title><desc id="d">The page (board canvas, Markdown editor and review, export) talks only to a small preload bridge. The Electron main process does file dialogs and file access for files you chose, PDF printing, and starts the handwriting helper on Windows. Work is autosaved in IndexedDB. Nothing goes to the network.</desc><defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker></defs><rect width="960" height="470" rx="8" fill="#0d1117"/><text x="24" y="38" font-size="20" font-weight="700" fill="#f0f6fc">How it fits together</text><text x="24" y="60" font-size="13" fill="#9198a1">Plain JavaScript in the page, no bundler · Electron for the desktop app · the same page runs in a browser as an offline web app</text><rect x="24" y="86" width="430" height="250" rx="10" fill="#151b23" stroke="#3987e5" stroke-width="2"/><text x="40" y="114" font-size="15" font-weight="600" fill="#f0f6fc">Page (sandboxed renderer)</text><text x="40" y="138" font-size="12.5" fill="#9198a1">Board: canvas, ink with pressure, shapes, notes,</text><text x="40" y="158" font-size="12.5" fill="#9198a1">  text, images, emoji, lasso, infinite pan/zoom</text><text x="40" y="178" font-size="12.5" fill="#9198a1">Document: CodeMirror Markdown editor, preview,</text><text x="40" y="198" font-size="12.5" fill="#9198a1">  comments, replies, reactions, suggestions, ink</text><text x="40" y="218" font-size="12.5" fill="#9198a1">Review tab, Export for AI</text><text x="40" y="238" font-size="12.5" fill="#9198a1">Export: Word (.docx), PDF, HTML, Markdown, PNG</text><text x="40" y="258" font-size="12.5" fill="#9198a1">Autosave: IndexedDB in this app only</text><rect x="520" y="86" width="416" height="110" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="536" y="114" font-size="15" font-weight="600" fill="#f0f6fc">Preload bridge</text><text x="536" y="138" font-size="12.5" fill="#9198a1">A short, explicit list of calls. The page never</text><text x="536" y="158" font-size="12.5" fill="#9198a1">gets Node.js or file system access.</text><rect x="520" y="226" width="416" height="110" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="536" y="254" font-size="15" font-weight="600" fill="#f0f6fc">Electron main process</text><text x="536" y="278" font-size="12.5" fill="#9198a1">File dialogs; reads and writes only files you chose</text><text x="536" y="298" font-size="12.5" fill="#9198a1">PDF printing; blocks all network requests</text><rect x="520" y="366" width="200" height="84" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="536" y="394" font-size="15" font-weight="600" fill="#f0f6fc">Your files</text><text x="536" y="418" font-size="12.5" fill="#9198a1">.md · .wbdoc · exports</text><rect x="736" y="366" width="200" height="84" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.2"/><text x="752" y="394" font-size="15" font-weight="600" fill="#f0f6fc">Handwriting helper</text><text x="752" y="418" font-size="12.5" fill="#9198a1">Rust, Windows Ink, offline</text><line x1="454" y1="141" x2="518" y2="141" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a-dark)"/><text x="486" y="133" font-size="12" fill="#9198a1" text-anchor="middle">IPC</text><line x1="728" y1="196" x2="728" y2="224" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a-dark)"/><line x1="620" y1="336" x2="620" y2="364" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a-dark)"/><line x1="836" y1="336" x2="836" y2="364" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a-dark)"/><text x="24" y="372" font-size="13" fill="#f0f6fc" font-weight="600">Runs on</text><text x="24" y="394" font-size="12.5" fill="#9198a1">Windows 10/11 (x64), Windows 11 on ARM · Linux (x64, ARM64; .deb, AppImage)</text><text x="24" y="414" font-size="12.5" fill="#9198a1">Any modern browser as an offline web app (npm run web)</text><text x="24" y="434" font-size="12.5" fill="#9198a1">Handwriting to text needs Windows</text></svg>
