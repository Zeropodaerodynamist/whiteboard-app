<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="-apple-system, 'Segoe UI', system-ui, 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Drawing performance, Whiteboard 2.0 vs 2.1</title><desc id="d">Measured on a Surface Pro 7 drawing one 2,478-point pen stroke. Canvas raster work fell from 210 to 44 ms per second on an empty board and from 205 to 42 with 5,000 elements. Raster time per frame at the 95th percentile fell from 5.9 to 0.55 ms and from 6.1 to 0.55 ms. The GPU process main thread fell from 374 to 282 and from 389 to 296 ms per second. The page main thread rose from 105 to 158 ms per second. Frame rate stayed at 58 to 59 fps.</desc><rect width="960" height="640" rx="8" fill="#ffffff"/><text x="24" y="38" font-size="20" font-weight="700" fill="#1f2328">Drawing with a pen: 2.0 vs 2.1</text><text x="24" y="60" font-size="13" fill="#59636e">Surface Pro 7 (i5-1035G4, Iris Plus, 2736×1824), Electron 45 · one 2,478-point pen stroke · median of 3 runs · frame rate unchanged (58–59 fps)</text><rect x="24" y="74" width="12" height="12" rx="3" fill="#eb6834"/><text x="42" y="84" font-size="13" fill="#1f2328">2.0 (before)</text><rect x="144" y="74" width="12" height="12" rx="3" fill="#2a78d6"/><text x="162" y="84" font-size="13" fill="#1f2328">2.1 (now)</text><text x="24" y="126" font-size="15" font-weight="600" fill="#1f2328">Canvas raster work</text><text x="24" y="145" font-size="12.5" fill="#59636e">ms per second of drawing · lower is better</text><line x1="68" x2="456" y1="324" y2="324" stroke="#c8ccd1" stroke-width="1"/><text x="60" y="328" font-size="11.5" fill="#59636e" text-anchor="end">0</text><line x1="68" x2="456" y1="269.3333333333333" y2="269.3333333333333" stroke="#e6e8eb" stroke-width="1"/><text x="60" y="273.3333333333333" font-size="11.5" fill="#59636e" text-anchor="end">100</text><line x1="68" x2="456" y1="214.66666666666669" y2="214.66666666666669" stroke="#e6e8eb" stroke-width="1"/><text x="60" y="218.66666666666669" font-size="11.5" fill="#59636e" text-anchor="end">200</text><line x1="68" x2="456" y1="160" y2="160" stroke="#e6e8eb" stroke-width="1"/><text x="60" y="164" font-size="11.5" fill="#59636e" text-anchor="end">300</text><path d="M110 324V213.2Q110 209.2 114 209.2H160Q164 209.2 164 213.2V324Z" fill="#eb6834"/><text x="137" y="203.2" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">210</text><path d="M166 324V303.94666666666666Q166 299.94666666666666 170 299.94666666666666H216Q220 299.94666666666666 220 303.94666666666666V324Z" fill="#2a78d6"/><text x="193" y="293.94666666666666" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">44</text><text x="165" y="344" font-size="12.5" fill="#59636e" text-anchor="middle">Empty board</text><path d="M304 324V215.93333333333334Q304 211.93333333333334 308 211.93333333333334H354Q358 211.93333333333334 358 215.93333333333334V324Z" fill="#eb6834"/><text x="331" y="205.93333333333334" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">205</text><path d="M360 324V305.04Q360 301.04 364 301.04H410Q414 301.04 414 305.04V324Z" fill="#2a78d6"/><text x="387" y="295.04" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">42</text><text x="359" y="344" font-size="12.5" fill="#59636e" text-anchor="middle">5,000 elements</text><text x="496" y="126" font-size="15" font-weight="600" fill="#1f2328">Raster time per frame</text><text x="496" y="145" font-size="12.5" fill="#59636e">ms, 95th percentile · lower is better</text><line x1="540" x2="928" y1="324" y2="324" stroke="#c8ccd1" stroke-width="1"/><text x="532" y="328" font-size="11.5" fill="#59636e" text-anchor="end">0</text><line x1="540" x2="928" y1="283" y2="283" stroke="#e6e8eb" stroke-width="1"/><text x="532" y="287" font-size="11.5" fill="#59636e" text-anchor="end">2</text><line x1="540" x2="928" y1="242" y2="242" stroke="#e6e8eb" stroke-width="1"/><text x="532